#
# /etc/rawm/rawm.conf: rawm runtime configuration
#

ui = {
  font = "monospace:size=9";
  border_width = 2;
  snap = 32;
  opacity = 1.0;

  bar = {
    show = true;
    position = "bottom";
    height = 0; # 0 lets rawm derive the height from the font.
  };

  systray = {
    show = true;
    spacing = 2;
  };

  colors = {
    normal = {
      border = "#cccccc";
      foreground = "#000000";
      background = "#cccccc";
    };
    selected = {
      border = "#0066ff";
      foreground = "#ffffff";
      background = "#0066ff";
    };
    urgent = {
      border = "#0066ff";
      foreground = "#0066ff";
      background = "#ffffff";
    };
    error = {
      border = "#ff0000";
      foreground = "#ffffff";
      background = "#ff0000";
    };
  };
};

behavior = {
  autocenter_dialogs = false;
  resize_hints = false;
};

layout = {
  master_factor = 0.55;
  master_count = 1;

  gaps = {
    inner = 0;
    outer = 0;
    smart = false;
  };

  symbols = {
    tile = "[]=";
    floating = "<1/1>";
    monocle = "[1/1]";
    bstack = "TTT";
    bstack_horizontal = "===";
    grid = "###";
  };
};

tags = {
  default = (
    { name = "1"; layout = "tile"; },
    { name = "2"; layout = "tile"; },
    { name = "3"; layout = "tile"; },
    { name = "4"; layout = "tile"; },
    { name = "5"; layout = "tile"; },
    { name = "6"; layout = "tile"; },
    { name = "7"; layout = "tile"; },
    { name = "8"; layout = "tile"; },
    { name = "9"; layout = "tile"; }
  );

  # Per-monitor overrides must define the same number of tags as default.
  monitors = ();
};

# Rules replace the previous layer's complete rule list when present.
rules = ();

# Commands are argv vectors. They are executed directly; no shell is implied.
# Command groups merge by name across configuration layers.
commands = {
  terminal = ("st");
  launcher = ("dmenu_run");
};

