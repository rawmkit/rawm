#
# /etc/rawm/rawmsession.conf: rawm desktop-session lifecycle policy
#
# rawmsession executes argv vectors directly. No shell is implied.
#
# The primary command defines the lifetime of the graphical session. rawm
# performs its own in-place SIGHUP restart, so rawmsession never respawns the
# primary after it exits.
#
primary = ("rawm");

# Sidecars are long-lived foreground session infrastructure. An unexpected
# exit, including status zero, is restarted with a bounded crash budget. Do not
# use daemon/background options here. Remove an entry to leave that service
# outside rawmsession authority.
sidecars = (
  { name = "compositor"; command = ("picom"); }
);
