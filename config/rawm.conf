#
# /etc/rawm/rawm.conf: rawm runtime configuration
#

ui = {
  font = "monospace:size=9";
  border_width = 2;
  snap = 32;
  opacity = 1.0;


  osd = {
    show = false;
    position = "bottom";
    geometry = false;
    duration_ms = 800;
    padding = 10;
    offset = 24;
    min_width = 0;
  };


  colors = {
    normal = {
      border = "#cccccc";
      foreground = "#000000";
      background = "#cccccc";
    };
    selected = {
      border = "#0066ff";
      foreground = "#ffffff";
      background = "#0066ff";
    };
    urgent = {
      border = "#0066ff";
      foreground = "#0066ff";
      background = "#ffffff";
    };
    error = {
      border = "#ff0000";
      foreground = "#ffffff";
      background = "#ff0000";
    };
    floating = {
      border = "${ui.colors.selected.border}";
      foreground = "${ui.colors.selected.foreground}";
      background = "${ui.colors.selected.background}";
    };
  };
};


behavior = {
  dialog_center = "none";
  size_hints = "floating";
  floating_placement = "cascade";
  cascade_step = 32;
};

layout = {
  master_factor = 0.55;
  master_count = 1;

  gaps = {
    inner = 0;
    outer = 0;
    smart = false;
  };

  symbols = {
    tile = "[]=";
    floating = "<1/1>";
    monocle = "[1/1]";
    bstack = "TTT";
    bstack_horizontal = "===";
    grid = "###";
  };
};

tags = {
  default = (
    { name = "1"; layout = "tile"; },
    { name = "2"; layout = "tile"; },
    { name = "3"; layout = "tile"; },
    { name = "4"; layout = "tile"; },
    { name = "5"; layout = "tile"; },
    { name = "6"; layout = "tile"; },
    { name = "7"; layout = "tile"; },
    { name = "8"; layout = "tile"; },
    { name = "9"; layout = "tile"; }
  );

  # Per-monitor overrides must define the same number of tags as default.
  monitors = ();
};

# Rules replace the previous layer's complete rule list when present.
# Example: { class = "mpv"; tags = (8); fullscreen = true; }
rules = ();

# rawm owns only pointer mechanics that directly manipulate admitted clients.
pointer = {
  bindings = (
    { modifiers = ("Mod4"); button = 1; action = "move"; },
    { modifiers = ("Mod4"); button = 2; action = "toggle_floating"; },
    { modifiers = ("Mod4"); button = 3; action = "resize"; }
  );
};
